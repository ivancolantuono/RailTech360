
name: Telediagnostica Scan

on:
  workflow_dispatch:
    inputs:
      train:
        description: Seleziona un treno oppure tutti
        required: true
        default: "102"
        type: choice
        options:
          - "ALL"
          - "101"
          - "102"
          - "103"
          - "104"
          - "105"
          - "106"
          - "107"
          - "108"
          - "109"
          - "110"
          - "111"
          - "112"
          - "113"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        train: ${{ github.event.inputs.train == 'ALL' && fromJSON('["101","102","103","104","105","106","107","108","109","110","111","112","113"]') || fromJSON(format('["{0}"]', github.event.inputs.train)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: bot
        run: npm install

      - name: Install Playwright Chromium
        working-directory: bot
        run: npx playwright install --with-deps chromium

      - name: Scansione Telediagnostica
        working-directory: bot
        env:
          TELEDIA_USERNAME: ${{ secrets.TELEDIA_USERNAME }}
          TELEDIA_PASSWORD: ${{ secrets.TELEDIA_PASSWORD }}
          TELEDIA_LOGIN_URL: ${{ secrets.TELEDIA_LOGIN_URL }}
          TELEDIA_FLEET_URL: ${{ secrets.TELEDIA_FLEET_URL }}
          TELEDIA_TRAIN: ${{ matrix.train }}
          FILTER_SUBSYSTEM: "Trazione"
          FILTER_EVENT_NAME: "*dia*"
          FILTER_DESCRIPTION: "*apertura*"
          FILTER_DAYS: "10"
          HEADLESS: "true"
          SAVE_TO_SUPABASE: "false"
        run: npm run scan -- "$TELEDIA_TRAIN"

      - name: Upload risultati scansione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telediagnostica-treno-${{ matrix.train }}
          path: bot/output/
          if-no-files-found: ignore
          retention-days: 7
