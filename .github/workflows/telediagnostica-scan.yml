
name: Telediagnostica Scan

on:
  # Aggiornamento automatico ogni 6 ore
  schedule:
    - cron: "30 18 * * *"

  # Avvio manuale
  workflow_dispatch:
    inputs:
      train:
        description: Seleziona il treno da analizzare
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "101"
          - "102"
          - "103"
          - "104"
          - "105"
          - "106"
          - "107"
          - "108"
          - "109"
          - "110"
          - "111"
          - "112"
          - "113"

# Evita scansioni sovrapposte
concurrency:
  group: telediagnostica-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        train: ${{ fromJSON((github.event_name == 'schedule' || inputs.train == 'ALL') && '["101","102","103","104","105","106","107","108","109","110","111","112","113"]' || format('["{0}"]', inputs.train)) }}

    steps:
      # 1. Scarica il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Installa le dipendenze
      - name: Install dependencies
        working-directory: bot
        run: npm install

      # 4. Installa Chromium per Playwright
      - name: Install Playwright Chromium
        working-directory: bot
        run: npx playwright install --with-deps chromium

      # 5. Esegue la scansione
      - name: Scansione Telediagnostica
        working-directory: bot
        env:
          TELEDIA_USERNAME: ${{ secrets.TELEDIA_USERNAME }}
          TELEDIA_PASSWORD: ${{ secrets.TELEDIA_PASSWORD }}
          TELEDIA_LOGIN_URL: ${{ secrets.TELEDIA_LOGIN_URL }}
          TELEDIA_FLEET_URL: ${{ secrets.TELEDIA_FLEET_URL }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          TELEDIA_TRAIN: ${{ matrix.train }}

          FILTER_SUBSYSTEM: "Trazione"
          FILTER_EVENT_NAME: "*dia*"
          FILTER_DESCRIPTION: "*apertura*"
          FILTER_DAYS: "10"

          HEADLESS: "true"
          SAVE_TO_SUPABASE: "true"
          SUPABASE_TABLE: "telediagnostica_eventi"

        run: npm run scan -- "$TELEDIA_TRAIN"

      # 6. Carica i risultati come archivio
      - name: Upload risultati scansione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telediagnostica-treno-${{ matrix.train }}
          path: bot/output/
          if-no-files-found: ignore
          retention-days: 7
