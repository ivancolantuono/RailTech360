<style>

.content{padding:28px 30px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}.pagehead h1{margin:5px 0;font-size:27px;letter-spacing:-.7px}.pagehead p{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#17243a;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650}.btn:hover{border-color:#5276a4}.btn.primary{background:var(--blue);border-color:var(--blue);color:#071426}.btn.subtle{background:transparent}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.kpi-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1b3150;color:#8ec4ff;font-size:17px}.kpi-num{font-size:29px;font-weight:800;letter-spacing:-1px;margin:10px 0 3px}.kpi-foot{color:var(--muted);font-size:11px}.kpi-foot span{color:var(--green)}
.columns{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.card-head h2{font-size:15px;margin:0}.muted{color:var(--muted)}.tiny{font-size:11px}.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;padding:4px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8295b4;font-size:10px;letter-spacing:.9px;text-transform:uppercase;font-weight:800;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid #1e2c43;font-size:12px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#142139}.main-cell{font-weight:700}.sub-cell{color:var(--muted);font-size:11px;margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.s-open{color:var(--amber);background:#392e1b}.s-work{color:#73baff;background:#192f4a}.s-done{color:var(--green);background:#17372f}.s-critical{color:var(--red);background:#3b202b}
.side-stack{display:grid;gap:16px;align-content:start}.fleet-row{margin:16px 0}.fleet-label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px}.track{height:7px;background:#25334b;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue)}.fill.green{background:var(--green)}.fill.amber{background:var(--amber)}

.searchbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#101b2e;border-radius:10px;padding:0 13px;margin-bottom:18px}.searchbar input{border:0;outline:0;background:transparent;color:var(--text);width:100%;padding:13px 0}.searchbar span{color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#0e182a;color:var(--text);border:1px solid #2b3b56;border-radius:8px;padding:10px 11px;outline:none}.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.toolbar input{min-width:230px;flex:1}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#b8c7dd;font-weight:700}.field input[type="file"]{display:block;width:100%;max-width:100%;min-width:0;padding:10px;background:#fff;color:#172337;border:1px solid #cbd7e5;border-radius:8px;font-size:14px}.field input[type="file"]::file-selector-button{margin-right:10px;padding:8px 12px;border:0;border-radius:6px;background:#1677d2;color:#fff;font-weight:700}.field input[type="file"]::-webkit-file-upload-button{margin-right:10px;padding:8px 12px;border:0;border-radius:6px;background:#1677d2;color:#fff;font-weight:700}.field.full{grid-column:1/-1}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.empty{padding:28px;text-align:center;color:var(--muted)}.notice{border:1px solid #5d4c29;background:#2b2519;color:#f4d18a;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:18px}

.mobile-menu{display:none}

/* Open Item: tabella compatta che rientra nella larghezza della pagina */

function ccmPage(){
 return head("Analizza Log CCM","Carica un file .CAP, consulta gli eventi Summary e analizza i campioni LL.")+
 `<section class="card">
  <div class="field"><label for="ccmFile">File CCM (.CAP)</label><input id="ccmFile" type="file" accept="*/*"></div>
  <p class="muted tiny" style="margin-top:8px">L'analisi viene eseguita nel browser: il file non viene caricato su Supabase.</p>
  <div id="ccmMessage" class="muted" style="padding:12px 0">Seleziona un file .CAP per iniziare.</div>
 </section><div id="ccmWorkspace"></div>`;
}
const CCM_MAX_FIELDS=6;
let ccmParsed=null, ccmFiltered=[], ccmSelectedRec=null;
function ccmEsc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ccmSplitDescription(desc){
 let left=desc,description="";
 if(desc.includes(" - ")){[left,description]=[desc.slice(0,desc.indexOf(" - ")),desc.slice(desc.indexOf(" - ")+3)];}
 let fields=left.split(";").map(x=>x.trim()).filter(Boolean).slice(0,CCM_MAX_FIELDS);
 while(fields.length<CCM_MAX_FIELDS)fields.push("");
 return {fields,description:description.trim()};
}
function ccmParseText(text){
 const summary=[],llBlocks={};let currentRec=null,inLL=false,columns=[];
 const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/);
 const smRe=/^Rec:\s+(\d+)\s+Code:\s+([0-9A-Fa-f]+)\s+Date:(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2}:\d{2}\.\d{2})\s+-\s+(.*)$/;
 const llHeader=/^\s*N\.\s+/, llRow=/^\s*(-?\d+)\s+(.*)$/;
 for(const line of lines){
  const m=line.match(smRe);
  if(m){const d=ccmSplitDescription(m[5]);const rec=Number(m[1]);summary.push([rec,m[2],m[3],m[4],...d.fields,d.description]);llBlocks[rec]=[];currentRec=rec;inLL=false;continue;}
  if(llHeader.test(line)){columns=line.trim().split(/\s+/);inLL=true;continue;}
  if(inLL&&currentRec!==null){const r=line.match(llRow);if(!r)continue;const values=r[2].trim().split(/\s+/);if(values.length<columns.length-1)continue;const row={N:Number(r[1])};columns.slice(1).forEach((col,i)=>row[col]=values[i]);llBlocks[currentRec].push(row);}
 }
 return {summary,llBlocks};
}
function ccmDecodeWord(hexValue,bitMap){let value=parseInt(String(hexValue),16);if(!Number.isFinite(value))value=0;const result={};Object.entries(bitMap).forEach(([bit,name])=>{if(name!=="-----")result[name]=(value>>Number(bit))&1;});return result;}
function ccmDecodeRec(row){const states={};CCM_DIGITAL_WORDS.forEach(word=>{if(CCM_BIT_MAP[word]&&Object.prototype.hasOwnProperty.call(row,word))Object.assign(states,ccmDecodeWord(row[word],CCM_BIT_MAP[word]));});return states;}
function ccmRenderSummary(rows){
 if(!rows.length)return `<div class="notice">Nessun evento trovato.</div>`;
 const heads=["REC","CODE","DATE","TIME",..."123456".split("").map(n=>"F"+n),"DESCRIZIONE"];
 return `<div class="table-wrap ccm-summary-scroll" style="max-height:390px;overflow:auto;border:1px solid var(--border,#dbe2ea);border-radius:10px"><table style="margin:0"><thead><tr>${heads.map(x=>`<th style="position:sticky;top:0;z-index:2;background:var(--card,#fff)">${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td>${ccmEsc(r[0])}</td><td>${ccmEsc(r[1])}</td><td>${ccmEsc(r[2])}</td><td>${ccmEsc(r[3])}</td>${r.slice(4,10).map(x=>`<td>${ccmEsc(x)}</td>`).join("")}<td>${ccmEsc(r[10])}</td></tr>`).join("")}</tbody></table></div>`;
}
function ccmRenderWord(word,states){
 const signals=CCM_BIT_MAP[word]||{};
 const items=Object.entries(signals).filter(([bit,name])=>name!=="-----").map(([bit,name])=>{
  const on=!!states[name],desc=CCM_DIGITAL_DESCRIPTIONS[name]||"";
  return `<div class="ccm-signal ${on?"ccm-on":"ccm-off"}" title="${ccmEsc(desc)}"><span class="ccm-led ${on?"ccm-led-on":"ccm-led-off"}"></span>${ccmEsc(name)}${desc?`<span class="ccm-tip">${ccmEsc(desc)}</span>`:""}</div>`;
 }).join("");
 return `<div class="ccm-word"><div class="ccm-title">${ccmEsc(word)}</div>${items}</div>`;
}
function ccmRenderAnalog(row){
 const maxes={vTVL:5000,vTV1:5000,iTA1M:100,iTA2M:100,iTA:100,vTVI:5000,da1:100,db1:100,ta1:100,tb1:100,dfr:100,tcha:100,tchb:100,vref:100,Vref:100,OVPD:5000,TOVPD:100,vF:5000,dvF:5000,vL:5000,dvL:5000,vFdvf:5000,vLdvl:5000};
 return CCM_ANALOG_SIGNALS.map(signal=>{
  const raw=row[signal],empty=raw===undefined||raw===null||raw==="";
  const num=empty?NaN:Number(String(raw).replace(",",".")),pct=Number.isFinite(num)?Math.min(100,Math.abs(num)/(maxes[signal]||100)*100):0;

async function searchComponents(){
  const msg=document.getElementById("componentMessage"),out=document.getElementById("componentResults"),input=document.getElementById("componentQuery");
  const q=input?.value.trim();out.innerHTML="";
  if(!q){msg.textContent="Inserisci un termine di ricerca.";return}
  const cfg=getSupabaseConfig();
  if(!cfg.url||!cfg.key){msg.innerHTML='Database non configurato. Premi <b>Configura database</b> per inserire Project URL e chiave pubblica.';return}
  if(!window.supabase){msg.textContent="Impossibile caricare la libreria Supabase. Verifica la connessione Internet.";return}
  msg.textContent="Ricerca in corso…";
  document.getElementById("componentSearchBtn").disabled=true;
  try{
    const client=window.supabase.createClient(cfg.url,cfg.key);
    const limit=Number(document.getElementById("componentLimit").value)||25;
    const columns=["ELEMENTO","ASSIEME","COMPONENTE","Part_Number","Pn_Ricambio","PnRicambio2","Pn_CS2","IDRA TI","Descrizione_TI","Aggiornato al"];
    const norm=v=>String(v??"").toLocaleLowerCase("it-IT");
    const needle=norm(q);
    let matches=[],start=0,step=1000;
    // select(*) evita problemi con nomi di colonna che contengono spazi o maiuscole.
    // La ricerca viene eseguita sui record letti da Supabase, senza rinominare le colonne.
    while(matches.length<limit){
      const {data:batch,error}=await client.from("magazzino").select("*").order("id").range(start,start+step-1);
      if(error)throw error;
      if(!batch||batch.length===0)break;
      for(const r of batch){
        if(columns.some(c=>norm(r[c]).includes(needle))){matches.push(r);if(matches.length>=limit)break;}
      }
      if(batch.length<step)break;
      start+=step;
    }
    if(!matches.length){msg.textContent="Nessun componente trovato per “"+q+"”.";return}
    msg.textContent=`Trovati ${matches.length} risultati (limite ${limit}).`;
    window.componentSearchResults=matches;
    out.innerHTML=table(["Seleziona","ID","ELEMENTO","ASSIEME","COMPONENTE","Part_Number","Pn_Ricambio","PnRicambio2","Pn_CS2","IDRA TI","Descrizione_TI","Aggiornato al"],matches.map((r,i)=>`<tr>
      <td><input type="radio" name="selectedComponent" value="${i}" aria-label="Seleziona componente" onchange="updateEditComponentButton()"></td>
      <td>${escapeHtml(r.id??"—")}</td>
      <td>${escapeHtml(r["ELEMENTO"]||"—")}</td>
      <td>${escapeHtml(r["ASSIEME"]||"—")}</td>
      <td style="white-space:normal;min-width:180px">${escapeHtml(r["COMPONENTE"]||"—")}</td>
      <td><span class="component-pn">${escapeHtml(r["Part_Number"]||"—")}</span></td>
      <td>${escapeHtml(r["Pn_Ricambio"]||"—")}</td>
      <td>${escapeHtml(r["PnRicambio2"]||"—")}</td>
      <td>${escapeHtml(r["Pn_CS2"]||"—")}</td>
      <td>${escapeHtml(r["IDRA TI"]||"—")}</td>
      <td style="white-space:normal;min-width:220px;max-width:360px">${escapeHtml(r["Descrizione_TI"]||"—")}</td>

async function analyzeMnt(){
 const file=document.getElementById("mntFile").files[0],msg=document.getElementById("mntMessage");if(!file){msg.textContent="Seleziona prima un file .MNT.";return}

  let cassa=document.getElementById("mntCassa").value;if(cassa==="auto"){let m=(file.name+"\\n"+text.slice(0,4000)).toUpperCase().match(/\bDM[18]\b/);cassa=m?m[0]:"SCONOSCIUTA"}

  let records=[];
  if(hi>=0){let h=splitMnt(lines[hi]).map(normCol), ix={add:h.indexOf("ADD"),i:h.indexOf("I"),ii:h.indexOf("I_I"),sta:h.indexOf("STA")};
   if(ix.add<0)throw new Error("Intestazione ADD non trovata.");
   for(let line of lines.slice(hi+1)){if(!line.trim())continue;let p=splitMnt(line),add=normSensor(p[ix.add]);if(!add)continue;records.push({ADD:add,I:ix.i>=0?numMnt(p[ix.i]):null,I_I:ix.ii>=0?numMnt(p[ix.ii]):null,STA:ix.sta>=0?numMnt(p[ix.sta]):null,PW4:p.length>10?numMnt(p[10]):null})}

  }

  const order=cassa==="DM1"?ORDER_DM1:cassa==="DM8"?ORDER_DM8:null;if(order){let pos=new Map(order.map((v,i)=>[v,i]));records.sort((a,b)=>(pos.get(a.ADD)??9999)-(pos.get(b.ADD)??9999))}
  if(!records.length)throw new Error("Nessun dato sensore riconosciuto. Verifica il formato del file.");
  const critical=records.filter(r=>r.STA!==null&&r.STA<=45),ii=records.map(r=>r.I_I).filter(v=>v!==null),pw=records.map(r=>r.PW4).filter(v=>v!==null);

  document.getElementById("mntCharts").innerHTML=`<h2>STA e I_I per sensore</h2><div style="height:300px"><canvas id="sensorChart" style="width:100%;height:100%"></canvas></div><h2>PW4 per sensore</h2><div style="height:240px"><canvas id="pwChart" style="width:100%;height:100%"></canvas></div>`;
  drawSensorChart("sensorChart",records,["STA","I_I"]);drawSensorChart("pwChart",records,["PW4"]);
  document.getElementById("mntTable").innerHTML=`<details class="sensor-table-details"><summary>📊 Mostra tabella completa dei sensori (${records.length})</summary><div style="margin-top:12px">${table(["ADD / Sensore","I","I_I","STA","PW4"],records.map(r=>`<tr><td>${r.ADD}</td><td>${r.I??"—"}</td><td>${r.I_I??"—"}</td><td style="${r.STA!==null&&r.STA<=45?'color:var(--red);font-weight:800':''}">${r.STA??"—"}</td><td>${r.PW4??"—"}</td></tr>`).join(""))}</div></details>`;

}
function drawSensorChart(id,rows,keys){
 const canvas=document.getElementById(id);if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,pad={l:42,r:12,t:12,b:48};ctx.clearRect(0,0,w,h);
 const vals=rows.flatMap(r=>keys.map(k=>r[k])).filter(v=>v!==null&&v!==undefined);if(!vals.length){ctx.fillStyle="#94a5c2";ctx.fillText("Nessun valore numerico",pad.l,30);return}let min=Math.min(0,...vals),max=Math.max(...vals);if(max===min)max=min+1;
 const x=i=>pad.l+i*(w-pad.l-pad.r)/Math.max(1,rows.length-1),y=v=>h-pad.b-(v-min)*(h-pad.t-pad.b)/(max-min);
 ctx.strokeStyle="#293a56";ctx.fillStyle="#94a5c2";ctx.font="10px sans-serif";for(let j=0;j<=4;j++){let v=min+(max-min)*j/4,yy=y(v);ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(v.toFixed(1),3,yy+3)}
 const colors=["#4ea1ff","#49d4e8","#f4bd58"];keys.forEach((k,ki)=>{ctx.strokeStyle=colors[ki%colors.length];ctx.lineWidth=2;ctx.beginPath();let started=false;rows.forEach((r,i)=>{if(r[k]===null||r[k]===undefined){started=false;return}if(!started){ctx.moveTo(x(i),y(r[k]));started=true}else ctx.lineTo(x(i),y(r[k]))});ctx.stroke()});
 ctx.fillStyle="#94a5c2";const step=Math.max(1,Math.ceil(rows.length/18));rows.forEach((r,i)=>{if(i%step===0){ctx.save();ctx.translate(x(i),h-pad.b+5);ctx.rotate(-Math.PI/3);ctx.fillText(r.ADD,-2,0);ctx.restore()}});ctx.fillText(keys.join(" / "),pad.l, h-5);
}

  const title=document.getElementById("authTitle"),sub=document.getElementById("authSubtitle"),name=document.getElementById("authNameField"),phoneField=document.getElementById("authPhoneField"),phone=document.getElementById("authPhone"),pw=document.getElementById("authPasswordField"),confirm=document.getElementById("authConfirmField"),submit=document.getElementById("authSubmit"),links=document.getElementById("authLinks"),password=document.getElementById("authPassword"),email=document.getElementById("authEmail"),emailField=document.getElementById("authEmailField");
  const isReset=mode==="reset",isSignup=mode==="signup",isUpdate=mode==="updatePassword";
  title.textContent=isSignup?"Crea un account":isReset?"Recupera password":isUpdate?"Imposta nuova password":"Accedi";
  sub.textContent=isSignup?"Registrati inserendo tutti i tuoi dati.":isReset?"Ti invieremo un link per reimpostare la password.":isUpdate?"Scegli una nuova password per il tuo account.":"Accedi con email e password.";
  name.hidden=!isSignup;phoneField.hidden=!isSignup;phone.required=isSignup;pw.hidden=isReset;confirm.hidden=!(isSignup||isUpdate);emailField.hidden=isUpdate;email.required=!isUpdate;email.type="email";email.autocomplete="email";email.placeholder="nome@azienda.it";emailField.querySelector("label").textContent="Email";password.required=!isReset;password.autocomplete=(isSignup||isUpdate)?"new-password":"current-password";
  document.getElementById("authName").required=isSignup;document.getElementById("authConfirm").required=isSignup||isUpdate;
  submit.textContent=isSignup?"Registrati":isReset?"Invia link di recupero":isUpdate?"Salva nuova password":"Accedi";
  links.innerHTML=isSignup?'<button class="auth-link" type="button" onclick="showAuthMode(\'login\')">Hai già un account? Accedi</button>':isReset?'<button class="auth-link" type="button" onclick="showAuthMode(\'login\')">Torna all’accesso</button>':isUpdate?"":'<button class="auth-link" type="button" onclick="showAuthMode(\'reset\')">Password dimenticata?</button><button class="auth-link" type="button" onclick="showAuthMode(\'signup\')">Crea un account</button>';
  if(message)authMessage(message,"success");
}
function showAuthOverlay(){const el=document.getElementById("authOverlay");if(el)el.style.display="flex"}
function hideAuthOverlay(){const el=document.getElementById("authOverlay");if(el)el.style.display="none"}
async function finishAuthGate(session){
  if(!session?.user){showAuthMode("login");showAuthOverlay();return}
  // Il link di recupero deve consentire di impostare la nuova password prima di entrare nell'app.
  if(authRecoverySession){showAuthMode("updatePassword");showAuthOverlay();return}
  hideAuthOverlay();
  const user=session.user;
  const label=user.user_metadata?.full_name||user.email||"Operatore";
  const avatar=document.querySelector(".top-actions .avatar");
  if(avatar){avatar.textContent=label.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"RM";avatar.title=label;avatar.style.cursor="pointer";avatar.onclick=async()=>{if(confirm("Vuoi uscire da Railway Maintenance?")){try{const {error}=await getAuthClient().auth.signOut();if(error)throw error;authRecoverySession=false;showAuthMode("login");showAuthOverlay();toast("Disconnessione completata.")}catch(e){toast("Errore durante la disconnessione: "+(e.message||String(e)))}}};}
  render();
}
document.getElementById("authForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("authSubmit");btn.disabled=true;const old=btn.textContent;btn.textContent="Attendi…";clearAuthMessage();
  const identifier=document.getElementById("authEmail").value.trim();const email=identifier;const password=document.getElementById("authPassword").value;const confirmPw=document.getElementById("authConfirm").value;const fullName=document.getElementById("authName").value.trim();const phone=document.getElementById("authPhone").value.trim();
  try{
    const client=getAuthClient();let result;
    if(authMode==="signup"){
      if(password.length<8)throw new Error("La password deve contenere almeno 8 caratteri.");
      if(password!==confirmPw)throw new Error("Le password non coincidono.");
      if(!phone)throw new Error("Inserisci il numero di telefono.");
      result=await client.auth.signUp({email,password,options:{data:{full_name:fullName,phone},emailRedirectTo:location.origin+location.pathname}});
      if(result.error)throw result.error;
      if(result.data?.session){authRecoverySession=false;await finishAuthGate(result.data.session);toast("Registrazione completata.")}
      else{showAuthMode("login");authMessage("Registrazione inviata. Controlla la tua email e conferma l'indirizzo prima di accedere.","success");}
    }else if(authMode==="reset"){
      result=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(result.error)throw result.error;
      authMessage("Se l'indirizzo è registrato, riceverai un'email con il link per reimpostare la password.","success");
    }else if(authMode==="updatePassword"){
      if(password.length<8)throw new Error("La nuova password deve contenere almeno 8 caratteri.");
      if(password!==confirmPw)throw new Error("Le password non coincidono.");
      result=await client.auth.updateUser({password});if(result.error)throw result.error;
      authRecoverySession=false;authMessage("Password aggiornata. Accesso in corso…","success");
      setTimeout(()=>finishAuthGate(result.data?.user?{user:result.data.user}:null),700);
    }else{
      if(!identifier.includes("@"))throw new Error("Inserisci un indirizzo email valido.");
      result=await client.auth.signInWithPassword({email:identifier,password});if(result.error)throw result.error;
      authRecoverySession=false;await finishAuthGate(result.data.session);toast("Accesso effettuato.");
    }
  }catch(err){authMessage(err.message||"Operazione non riuscita. Riprova.","error")}
  finally{btn.disabled=false;btn.textContent=old;}
});
(async function initAuth(){
  try{
    const client=getAuthClient();
    client.auth.onAuthStateChange((event,session)=>{
      if(event==="PASSWORD_RECOVERY"){authRecoverySession=true;showAuthMode("updatePassword");showAuthOverlay();return}
      if(event==="SIGNED_OUT"){authRecoverySession=false;showAuthMode("login");showAuthOverlay();return}
      if(event==="SIGNED_IN"&&session&&!authRecoverySession){hideAuthOverlay();}
    });
    const {data,error}=await client.auth.getSession();if(error)throw error;
    const recovery=new URLSearchParams(location.hash.replace(/^#/ ,"")).get("type")==="recovery";
    if(recovery){authRecoverySession=true;showAuthMode("updatePassword");showAuthOverlay();}
    else if(data.session){await finishAuthGate(data.session);}
    else{showAuthMode("login");showAuthOverlay();}
  }catch(err){showAuthMode("login");showAuthOverlay();authMessage("Impossibile inizializzare l'autenticazione: "+(err.message||String(err)),"error")}
})();


// Migliora la selezione file su smartphone: input visibili e nessun filtro rigido sull'estensione.
document.addEventListener("change",function(e){
 const el=e.target;
 if(!el || el.type!=="file" || !el.files || !el.files.length) return;
 const file=el.files[0];
 if(el.id==="logFile"){const info=document.getElementById("fileInfo");if(info)info.textContent="File selezionato: "+file.name+" ("+Math.max(1,Math.round(file.size/1024))+" KB)";}
});
