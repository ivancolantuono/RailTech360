<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Railway Maintenance | Manutenzione ferroviaria</title>
<style>
:root{--bg:#0a1020;--panel:#111b2e;--panel2:#15223a;--line:#24334d;--text:#edf3ff;--muted:#94a5c2;--blue:#4ea1ff;--cyan:#49d4e8;--green:#42d6a0;--amber:#f4bd58;--red:#ff727e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{background:#0d1628;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-icon{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#287de7,#39d2dc);display:grid;place-items:center;font-size:21px;font-weight:900;color:#071426}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:var(--muted);font-size:11px}
.nav-label{font-size:10px;color:#7285a5;font-weight:800;letter-spacing:1.6px;padding:0 13px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9fb0ca;text-align:left;padding:11px 13px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover{background:#17243a;color:white}.nav button.active{background:#18345b;color:#fff;box-shadow:inset 3px 0 var(--blue)}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border:1px solid var(--line);background:#111c30;padding:13px;border-radius:12px}.side-bottom b{font-size:12px}.side-bottom p{font-size:11px;color:var(--muted);margin:5px 0 0}
main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0b1323;position:sticky;top:0;z-index:4}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:12px}.badge-demo{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#f7c86b;border:1px solid #72572a;background:#302717;padding:6px 9px;border-radius:7px;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:#24466d;color:#cce6ff;display:grid;place-items:center;font-weight:800}
.content{padding:28px 30px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}.pagehead h1{margin:5px 0;font-size:27px;letter-spacing:-.7px}.pagehead p{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#17243a;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650}.btn:hover{border-color:#5276a4}.btn.primary{background:var(--blue);border-color:var(--blue);color:#071426}.btn.subtle{background:transparent}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.kpi-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1b3150;color:#8ec4ff;font-size:17px}.kpi-num{font-size:29px;font-weight:800;letter-spacing:-1px;margin:10px 0 3px}.kpi-foot{color:var(--muted);font-size:11px}.kpi-foot span{color:var(--green)}
.columns{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.card-head h2{font-size:15px;margin:0}.muted{color:var(--muted)}.tiny{font-size:11px}.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;padding:4px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8295b4;font-size:10px;letter-spacing:.9px;text-transform:uppercase;font-weight:800;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid #1e2c43;font-size:12px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#142139}.main-cell{font-weight:700}.sub-cell{color:var(--muted);font-size:11px;margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.s-open{color:var(--amber);background:#392e1b}.s-work{color:#73baff;background:#192f4a}.s-done{color:var(--green);background:#17372f}.s-critical{color:var(--red);background:#3b202b}
.side-stack{display:grid;gap:16px;align-content:start}.fleet-row{margin:16px 0}.fleet-label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px}.track{height:7px;background:#25334b;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue)}.fill.green{background:var(--green)}.fill.amber{background:var(--amber)}
.deadline{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #223149}.deadline:last-child{border-bottom:0}.datebox{width:43px;height:46px;flex-shrink:0;border:1px solid #334663;background:#16243a;border-radius:9px;display:grid;place-content:center;text-align:center}.datebox b{font-size:16px;line-height:1.1}.datebox span{font-size:9px;color:var(--muted);text-transform:uppercase}.deadline strong{font-size:12px;display:block}.deadline small{font-size:11px;color:var(--muted)}
.searchbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#101b2e;border-radius:10px;padding:0 13px;margin-bottom:18px}.searchbar input{border:0;outline:0;background:transparent;color:var(--text);width:100%;padding:13px 0}.searchbar span{color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#0e182a;color:var(--text);border:1px solid #2b3b56;border-radius:8px;padding:10px 11px;outline:none}.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.toolbar input{min-width:230px;flex:1}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#b8c7dd;font-weight:700}.field.full{grid-column:1/-1}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.empty{padding:28px;text-align:center;color:var(--muted)}.notice{border:1px solid #5d4c29;background:#2b2519;color:#f4d18a;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:18px}
.toast{position:fixed;right:22px;bottom:22px;background:#15372f;border:1px solid #2b806b;color:#c6ffed;padding:13px 17px;border-radius:10px;box-shadow:0 10px 35px #0007;z-index:10;display:none}
.mobile-menu{display:none}

.component-results{margin-top:16px}.config-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}.config-box .field.full{grid-column:1/-1}.config-status{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.config-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#7889a5}.config-status.ok{color:var(--green)}.config-status.ok:before{background:var(--green)}.component-detail{white-space:normal;min-width:180px;max-width:320px}.component-pn{font-weight:800;color:#b9dcff}.small-action{padding:7px 10px;font-size:11px}
@media(max-width:700px){.config-box{grid-template-columns:1fr}.config-box .field.full{grid-column:auto}}

@media(max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr)}.content{padding:22px 20px}.topbar{padding:0 20px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;z-index:8;inset:0 auto 0 0;width:260px;box-shadow:15px 0 50px #0009}.sidebar.open{display:flex}.topbar{height:64px;padding:0 15px}.mobile-menu{display:inline-block}.content{padding:20px 14px}.pagehead{display:block}.pagehead h1{font-size:24px}.pagehead .actions{margin-top:15px}.kpis{gap:10px}.card{padding:14px}.kpi-num{font-size:25px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.badge-demo{display:none}}

/* Autenticazione Supabase */
.auth-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#18345b 0%,#0a1020 60%);overflow:auto}
.auth-card{width:min(100%,440px);background:#111b2e;border:1px solid #2b3b56;border-radius:18px;padding:28px;box-shadow:0 24px 80px #0008}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.auth-brand .brand-icon{flex-shrink:0}.auth-card h1{font-size:24px;margin:0 0 6px}.auth-subtitle{color:#94a5c2;margin:0 0 22px}.auth-form{display:grid;gap:14px}.auth-form .field input{width:100%;min-width:0}.auth-message{display:none;border-radius:9px;padding:11px 12px;font-size:12px;white-space:pre-wrap}.auth-message.error{display:block;background:#3b202b;border:1px solid #80404d;color:#ffd1d6}.auth-message.success{display:block;background:#17372f;border:1px solid #2b806b;color:#c6ffed}.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.auth-link{border:0;background:transparent;color:#8ec4ff;padding:4px 0;font-weight:700}.auth-link:hover{text-decoration:underline}.auth-hint{font-size:11px;color:#94a5c2;margin-top:18px}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <section class="auth-card">
    <div class="auth-brand"><div class="brand-icon" aria-hidden="true">🚄</div><div><strong>Railway Maintenance</strong><div class="muted tiny">Accesso operatori</div></div></div>
    <h1 id="authTitle">Accedi</h1><p class="auth-subtitle" id="authSubtitle">Accedi con il tuo account aziendale.</p>
    <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>
    <form id="authForm" class="auth-form">
      <div class="field" id="authNameField" hidden><label for="authName">Nome e cognome</label><input id="authName" name="name" autocomplete="name" maxlength="100" placeholder="Nome Cognome"></div>
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="nome@azienda.it"></div>
      <div class="field" id="authPasswordField"><label for="authPassword">Password</label><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="Almeno 8 caratteri"></div>
      <div class="field" id="authConfirmField" hidden><label for="authConfirm">Conferma password</label><input id="authConfirm" name="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Ripeti la password"></div>
      <button class="btn primary" id="authSubmit" type="submit">Accedi</button>
    </form>
    <div class="auth-links" id="authLinks"><button class="auth-link" type="button" onclick="showAuthMode('reset')">Password dimenticata?</button><button class="auth-link" type="button" onclick="showAuthMode('signup')">Crea un account</button></div>
    <div class="auth-hint">Le credenziali sono gestite da Supabase Auth. Non usare la password di altri servizi.</div>
  </section>
</div>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-icon" aria-label="Logo ferroviario" title="Railway Maintenance"><svg viewBox="0 0 48 48" width="30" height="30" role="img" aria-hidden="true"><path d="M14 5h20c5 0 8 4 8 9v16c0 4-2 7-6 9l4 4h-7l-4-4h-10l-4 4H8l4-5c-4-2-6-5-6-9V14c0-5 3-9 8-9Z" fill="#f5fbff"/><path d="M15 11h18c2 0 3 1 3 3v10H12V14c0-2 1-3 3-3Z" fill="#287de7"/><path d="M12 28h24v3c0 3-2 5-5 5H17c-3 0-5-2-5-5Z" fill="#49d4e8"/><circle cx="17" cy="31" r="2" fill="#0d1628"/><circle cx="31" cy="31" r="2" fill="#0d1628"/><path d="M18 7h12" stroke="#49d4e8" stroke-width="2" stroke-linecap="round"/></svg></div><div><strong>Railway Maintenance</strong><small>Maintenance intelligence</small></div></div>
  <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
    <button class="active" data-page="cercaComponente"><span class="ico">⌕</span>Cerca componente</button>
    <button data-page="openitem"><span class="ico">⚠</span>Open Item</button>
    <button data-page="sensori"><span class="ico">⌁</span>Misurazione sensori</button>
    <button data-page="fde"><span class="ico">⌕</span>Analizza Log FDE</button>
  </nav></div>

</aside>
<main>
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">Railway Maintenance <span style="padding:0 7px">/</span><span id="crumbCurrent">Cerca componente</span></div></div><div class="top-actions"><div class="avatar">RM</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const initial = {
  interventi:[
    {id:"INT-0268",treno:"ETR1000 · 102",cassa:"M6",titolo:"Sostituzione modulo CCM1",tecnico:"Marco R.",data:"2026-10-30",stato:"In lavorazione",esito:"",note:"Verifica funzionale al termine della sostituzione."},
    {id:"INT-0267",treno:"ETR1000 · 108",cassa:"TT7",titolo:"Verifica segnale diagnostico",tecnico:"Luca B.",data:"2026-10-30",stato:"Da verificare",esito:"",note:"Analisi della sequenza eventi."},
    {id:"INT-0266",treno:"ETR1000 · 096",cassa:"M3",titolo:"Controllo apparato antincendio",tecnico:"Sara P.",data:"2026-10-29",stato:"Completato",esito:"Regolare",note:"Controllo completato."},
    {id:"INT-0265",treno:"ETR1000 · 102",cassa:"M3",titolo:"Controllo circuito ausiliario",tecnico:"Marco R.",data:"2026-10-28",stato:"Completato",esito:"Regolare",note:"Dati dimostrativi."}
  ],
  openitem:[],
  scadenze:[
    {id:"SC-031",titolo:"Controllo impianto HVAC",treno:"ETR1000 · 102",data:"2026-11-02",responsabile:"Marco R."},
    {id:"SC-030",titolo:"Verifica apparato antincendio",treno:"ETR1000 · 108",data:"2026-11-04",responsabile:"Sara P."},
    {id:"SC-029",titolo:"Revisione componente",treno:"ETR1000 · 096",data:"2026-11-06",responsabile:"Luca B."}
  ],
  tecnici:["Marco R.","Luca B.","Sara P.","Andrea C."]
};
let data;
try { data=JSON.parse(localStorage.getItem("railtech360_data")) || structuredClone(initial); } catch(e){data=structuredClone(initial)}
function save(){localStorage.setItem("railtech360_data",JSON.stringify(data))}
let currentPage="cercaComponente";
const content=document.getElementById("content");
const pages={cercaComponente:"Cerca componente",openitem:"Open Item",sensori:"Misurazione sensori",fde:"Analizza Log FDE"};
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}
function statusClass(s){if(/completato|chiuso|regolare/i.test(s))return"s-done";if(/lavorazione|analisi/i.test(s))return"s-work";if(/alta|critico/i.test(s))return"s-critical";return"s-open"}
function pill(s){return `<span class="status ${statusClass(s)}">${s}</span>`}
function head(title,sub,buttons=""){return `<div class="pagehead"><div><div class="eyebrow">RAILWAY MAINTENANCE / ETR1000</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function kpi(label,num,icon,foot){return `<div class="card"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-num">${num}</div><div class="kpi-foot">${foot}</div></div>`}
function searchbar(placeholder="Cerca per treno, componente, matricola o guasto…"){return `<div class="searchbar"><span>⌕</span><input id="globalSearch" placeholder="${placeholder}"><span>↵</span></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nessun elemento trovato</td></tr>`}</tbody></table></div>`}
function dashboard(){let open=data.interventi.filter(x=>x.stato!=="Completato").length;return head("Dashboard manutenzione","Panoramica operativa · Flotta ETR1000",`<button class="btn" onclick="go('report')">Esporta / report</button><button class="btn primary" onclick="newIntervento()">＋ Nuovo intervento</button>`)+
`<div class="grid kpis">${kpi("Treni monitorati","12","🚄",'<span>●</span> Flotta dimostrativa')}${kpi("Interventi aperti",String(open).padStart(2,"0"),"🔧","Attività non completate")}${kpi("Open Item",String(data.openitem.length).padStart(2,"0"),"⚠","Anomalie da seguire")}${kpi("Scadenze in 7 giorni",String(data.scadenze.length).padStart(2,"0"),"◷","Prossime attività pianificate")}</div>
<div class="grid columns"><section class="card"><div class="card-head"><h2>Attività recenti</h2><button class="linkbtn" onclick="go('interventi')">Vedi tutti →</button></div>${table(["Intervento / treno","Attività","Stato","Data"],data.interventi.slice(0,4).map(x=>`<tr><td><div class="main-cell">${x.id}</div><div class="sub-cell">${x.treno} · Cassa ${x.cassa}</div></td><td>${x.titolo}</td><td>${pill(x.stato)}</td><td>${fmt(x.data)}</td></tr>`).join(""))}</section>
<div class="side-stack"><section class="card"><div class="card-head"><h2>Stato flotta</h2><span class="muted tiny">12 unità</span></div><div class="fleet-row"><div class="fleet-label"><span>Operativo</span><b>9 <span class="muted">/ 12</span></b></div><div class="track"><div class="fill green" style="width:75%"></div></div></div><div class="fleet-row"><div class="fleet-label"><span>In manutenzione</span><b>2 <span class="muted">/ 12</span></b></div><div class="track"><div class="fill amber" style="width:17%"></div></div></div><div class="fleet-row"><div class="fleet-label"><span>Da verificare</span><b>1 <span class="muted">/ 12</span></b></div><div class="track"><div class="fill" style="width:8%"></div></div></div><p class="muted tiny">Valori dimostrativi, non collegati a una flotta reale.</p></section>
<section class="card"><div class="card-head"><h2>Scadenze prossime</h2><button class="linkbtn" onclick="go('scadenze')">Tutte →</button></div>${data.scadenze.slice().sort((a,b)=>a.data.localeCompare(b.data)).slice(0,3).map(x=>`<div class="deadline"><div class="datebox"><b>${new Date(x.data+"T12:00:00").getDate()}</b><span>${new Date(x.data+"T12:00:00").toLocaleDateString("it-IT",{month:"short"})}</span></div><div><strong>${x.titolo}</strong><small>${x.treno} · ${x.responsabile}</small></div></div>`).join("")||'<p class="muted">Nessuna scadenza inserita.</p>'}</section></div></div>`}
function interventiPage(){let rows=data.interventi.map((x,i)=>`<tr><td><div class="main-cell">${x.id}</div><div class="sub-cell">${x.treno} · ${x.cassa}</div></td><td>${x.titolo}</td><td>${x.tecnico}</td><td>${fmt(x.data)}</td><td>${pill(x.stato)}</td><td><button class="btn" onclick="editIntervento(${i})">Apri</button></td></tr>`).join("");return head("Interventi","Registro delle lavorazioni e storico manutentivo",`<button class="btn primary" onclick="newIntervento()">＋ Nuovo intervento</button>`)+searchbar("Cerca ID, treno, cassa, attività o tecnico…")+`<section class="card">${table(["ID / Treno","Attività","Tecnico","Data","Stato",""],rows)}</section>`}
function flottaPage(){let trains=[["102","Operativo","12 Ott 2026"],["108","In manutenzione","30 Ott 2026"],["096","Operativo","29 Ott 2026"],["114","Da verificare","28 Ott 2026"],["121","Operativo","25 Ott 2026"],["105","Operativo","24 Ott 2026"]];return head("Flotta","Vista dimostrativa dei treni e delle unità manutentive",`<button class="btn" onclick="toast('La gestione completa della flotta sarà aggiunta nella prossima fase.')">＋ Aggiungi treno</button>`)+searchbar("Cerca numero treno o stato…")+`<section class="card">${table(["Treno","Serie","Ultimo aggiornamento","Stato","Azioni"],trains.map(t=>`<tr><td><div class="main-cell">ETR1000 · ${t[0]}</div><div class="sub-cell">8 casse · configurazione demo</div></td><td>Frecciarossa</td><td>${t[2]}</td><td>${pill(t[1])}</td><td><button class="btn" onclick="toast('Scheda treno ${t[0]}: dati dimostrativi.')">Scheda</button></td></tr>`).join(""))}</section><p class="muted tiny" style="margin-top:12px">Le unità mostrate sono esempi e non rappresentano lo stato reale di alcun treno.</p>`}
function openitemPage(){
  return head("Open Item","Anomalie registrate nel database condiviso",`<button class="btn" onclick="loadOpenItems()">↻ Aggiorna</button><button class="btn primary" onclick="newOpenItem()">＋ Nuovo Open Item</button>`)+
  searchbar("Cerca treno, descrizione, cassa o impianto…")+
  `<section class="card"><div id="openItemMessage" class="muted" style="padding:10px 0">Caricamento Open Item da Supabase…</div><div id="openItemResults"></div></section>`;
}

function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function searchComponents(){
  const msg=document.getElementById("componentMessage"),out=document.getElementById("componentResults"),input=document.getElementById("componentQuery");
  const q=input?.value.trim();out.innerHTML="";
  if(!q){msg.textContent="Inserisci un termine di ricerca.";return}
  const cfg=getSupabaseConfig();
  if(!cfg.url||!cfg.key){msg.innerHTML='Database non configurato. Premi <b>Configura database</b> per inserire Project URL e chiave pubblica.';return}
  if(!window.supabase){msg.textContent="Impossibile caricare la libreria Supabase. Verifica la connessione Internet.";return}
  msg.textContent="Ricerca in corso…";
  document.getElementById("componentSearchBtn").disabled=true;
  try{
    const client=window.supabase.createClient(cfg.url,cfg.key);
    const limit=Number(document.getElementById("componentLimit").value)||25;
    const columns=["ELEMENTO","ASSIEME","COMPONENTE","Part_Number","Pn_Ricambio","PnRicambio2","Pn_Consignment_Stoc","Pn_CS2","IDRA TI","Descrizione_TI","Aggiornato al"];
    const norm=v=>String(v??"").toLocaleLowerCase("it-IT");
    const needle=norm(q);
    let matches=[],start=0,step=1000;
    // select(*) evita problemi con nomi di colonna che contengono spazi o maiuscole.
    // La ricerca viene eseguita sui record letti da Supabase, senza rinominare le colonne.
    while(matches.length<limit){
      const {data:batch,error}=await client.from("magazzino").select("*").order("id").range(start,start+step-1);
      if(error)throw error;
      if(!batch||batch.length===0)break;
      for(const r of batch){
        if(columns.some(c=>norm(r[c]).includes(needle))){matches.push(r);if(matches.length>=limit)break;}
      }
      if(batch.length<step)break;
      start+=step;
    }
    if(!matches.length){msg.textContent="Nessun componente trovato per “"+q+"”.";return}
    msg.textContent=`Trovati ${matches.length} risultati (limite ${limit}).`;
    window.componentSearchResults=matches;
    out.innerHTML=table(["Seleziona","Elemento / Assieme","Componente / Descrizione","Part number","Codici ricambio","IDRA TI","Aggiornato al"],matches.map((r,i)=>`<tr>
      <td><input type="radio" name="selectedComponent" value="${i}" aria-label="Seleziona componente" onchange="updateEditComponentButton()"></td>
      <td><div class="main-cell">${escapeHtml(r["ELEMENTO"]||"—")}</div><div class="sub-cell">${escapeHtml(r["ASSIEME"]||"—")}</div></td>
      <td class="component-detail"><div class="main-cell">${escapeHtml(r["COMPONENTE"]||"—")}</div><div class="sub-cell">${escapeHtml(r["Descrizione_TI"]||"")}</div></td>
      <td><span class="component-pn">${escapeHtml(r["Part_Number"]||"—")}</span></td>
      <td>${[r["Pn_Ricambio"],r["PnRicambio2"],r["Pn_Consignment_Stoc"],r["Pn_CS2"]].filter(Boolean).map(escapeHtml).join("<br>")||"—"}</td>
      <td>${escapeHtml(r["IDRA TI"]||"—")}</td><td>${escapeHtml(r["Aggiornato al"]||"—")}</td></tr>`).join(""));
  }catch(err){
    msg.innerHTML=`<b>Errore durante la ricerca.</b><br>${escapeHtml(err.message||String(err))}<br><span class="tiny">Controlla URL, chiave pubblica, nomi delle colonne e policy SELECT (RLS) su magazzino.</span>`;
  }finally{const b=document.getElementById("componentSearchBtn");if(b)b.disabled=false}
}

const COMPONENT_FIELDS=[
  ["ELEMENTO","Elemento"],["ASSIEME","Assieme"],["COMPONENTE","Componente"],
  ["Part_Number","Part number"],["Pn_Ricambio","PN ricambio"],["PnRicambio2","PN ricambio 2"],
  ["Pn_Consignment_Stoc","PN consignment stock"],["Pn_CS2","PN CS2"],["IDRA TI","IDRA TI"],

function updateEditComponentButton(){const b=document.getElementById("editComponentBtn");if(b)b.disabled=!document.querySelector('input[name="selectedComponent"]:checked')}
function editSelectedComponent(){
  const sel=document.querySelector('input[name="selectedComponent"]:checked');
  if(!sel){toast("Seleziona prima un componente nei risultati.");return}
  const r=(window.componentSearchResults||[])[Number(sel.value)];if(!r){toast("Componente selezionato non disponibile.");return}
  openComponentForm("edit",r);
}
function openComponentForm(mode="add",record=null){
  const host=document.getElementById("componentFormHost");if(!host)return;
  const editing=mode==="edit";
  host.innerHTML=`<section class="card" style="margin-top:18px;border-color:#3b6594"><div class="card-head"><h2>${editing?"Modifica componente #"+escapeHtml(record.id):"Aggiungi componente"}</h2><button class="btn" type="button" onclick="closeComponentForm()">Chiudi</button></div>
  <form id="componentEditForm"><div class="form-grid">${COMPONENT_FIELDS.map(([key,label])=>`<div class="field"><label>${label}</label><input name="${escapeHtml(key)}" ${key==="COMPONENTE"&&!editing?"required":""} value="${escapeHtml(record?.[key]??"")}" placeholder="Inserisci ${escapeHtml(label.toLowerCase())}"></div>`).join("")}</div>
  <div class="form-actions"><button type="button" class="btn" onclick="closeComponentForm()">Annulla</button><button type="submit" class="btn primary">${editing?"Salva modifiche":"Aggiungi componente"}</button></div></form><div id="componentFormMessage" class="muted tiny" style="margin-top:10px"></div></section>`;
  host.scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("componentEditForm").addEventListener("submit",e=>saveComponent(e,mode,record?.id));
}
function closeComponentForm(){const host=document.getElementById("componentFormHost");if(host)host.innerHTML=""}
async function saveComponent(event,mode,id){
  event.preventDefault();const form=event.currentTarget;const msg=document.getElementById("componentFormMessage");const submit=form.querySelector('button[type="submit"]');
  const cfg=getSupabaseConfig();
  if(!window.supabase){msg.textContent="Libreria Supabase non disponibile.";return}
  const payload={};const fd=new FormData(form);
  for(const [key] of COMPONENT_FIELDS){const val=String(fd.get(key)||"").trim();payload[key]=val||null}
  if(!payload.COMPONENTE){msg.textContent="Il campo Componente è obbligatorio.";return}
  submit.disabled=true;msg.textContent=mode==="edit"?"Salvataggio modifiche…":"Inserimento componente…";
  try{
    const client=window.supabase.createClient(cfg.url,cfg.key);
    let result;
    if(mode==="edit") result=await client.from("magazzino").update(payload).eq("id",id).select("id").single();
    else result=await client.from("magazzino").insert(payload).select("id").single();
    if(result.error)throw result.error;
    toast(mode==="edit"?"Componente aggiornato.":"Componente aggiunto.");
    closeComponentForm();
    const q=document.getElementById("componentQuery");if(q&&q.value.trim())await searchComponents();else{const m=document.getElementById("componentMessage");if(m)m.textContent="Componente salvato. Inserisci un termine e premi Cerca per visualizzarlo.";const o=document.getElementById("componentResults");if(o)o.innerHTML=""}
  }catch(err){msg.innerHTML=`<b>Salvataggio non riuscito.</b> ${escapeHtml(err.message||String(err))}<br>Verifica le policy RLS INSERT/UPDATE della tabella magazzino e i campi obbligatori.`}
  finally{if(submit)submit.disabled=false}
}

function fdeClean(v){return String(v??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFD□�]/g,"").replace(/\s+/g," ").trim()}
function fdeTimestamp(v){v=String(v||"").trim().replace(/\s+/g," ");let d=new Date(v);if(!Number.isNaN(d.getTime()))return d;let m=v.match(/^[A-Za-z]{3}\s+([A-Za-z]{3})\s+(\d{1,2})\s+(\d{2}):(\d{2}):(\d{2})\s+(\d{4})$/);if(m){let months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};if(months[m[1].toLowerCase()]!==undefined)return new Date(+m[6],months[m[1].toLowerCase()],+m[2],+m[3],+m[4],+m[5])}m=v.match(/^(\d{1,2})-(\d{1,2})-(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]);return null}
function fdeParseFile(text,origin){let rows=[],timestamp=null,dataset=null,signal=null;for(let line of text.split(/\r?\n/)){line=line.trim();if(!line)continue;if(line.startsWith("------->")){timestamp=fdeTimestamp(line.replace("------->","").trim());dataset=null;signal=null;continue}if(!timestamp)continue;let found=false;for(const ds of FDE_DATASETS){const token=ds+"/",i=line.indexOf(token);if(i>=0){let part=line.slice(i+token.length);signal=(part.includes(":")?part.split(":",1)[0]:part).trim().split(/[\[_]/,1)[0].trim();dataset=ds;found=true;break}}if(found)continue;if(dataset&&signal){let raw=fdeClean(line),get=(re)=>{let m=raw.match(re);return m?m[1]:"-"};let coach=get(/COACH\s*N\s*:\s*(\d+)/i),number=get(/NUMBER\s*:\s*(\d+)/i),val=get(/DATA\s*:\s*(\d+)/i),car=FDE_CARRIAGES[coach]||coach,desc=val,upper=signal.toUpperCase();for(const [key,map] of Object.entries(FDE_DECODE)){if(upper.startsWith(key)){desc=map[val]??val;break}}let numDecoded=number;if(upper.startsWith("ISMOKESENSSTATE")||upper.startsWith("FSMOKESENS")){let n=Number(number);numDecoded=Number.isInteger(n)&&n>=0&&n<74?`SD${n+1}`:number}else if(upper.startsWith("IMAUINPUTSTATE")){numDecoded=({0:"BASSA PRESSIONE",1:"CONDOTTA ACQUA PRESSURIZZATA",2:"BASSA PRESSIONE",3:"CONDOTTA ACQUA PRESSURIZZATA"})[number]??number}let du=String(desc).toUpperCase(),nu=String(numDecoded).toUpperCase(),event="";if(du.includes("ALLARME INCENDIO"))event="ALLARME INCENDIO";else if(du.includes("ALLARME FUMO"))event="FUMO";else if(du.includes("ALLARME TERMICO"))event="TERMICO";else if(nu.includes("BASSA PRESSIONE"))event="BASSA PRESSIONE";else if(nu.includes("CONDOTTA ACQUA PRESSURIZZATA"))event="ACQUA PRESSURIZZATA";else if(du.includes("FUORI SERVIZIO"))event="FUORI SERVIZIO";else if(du.includes("FAULT")||du.includes("FAIL"))event="FAULT";rows.push({timestamp,origine:origin,dataset,segnale:signal,cassa:car,number:numDecoded,data_val:val,descrizione:desc,evento:event,valore:raw});dataset=null;signal=null}}return rows}

  }
  const unique=new Map();records.forEach(r=>unique.set(r.ADD,r));records=[...unique.values()];
  const order=cassa==="DM1"?ORDER_DM1:cassa==="DM8"?ORDER_DM8:null;if(order){let pos=new Map(order.map((v,i)=>[v,i]));records.sort((a,b)=>(pos.get(a.ADD)??9999)-(pos.get(b.ADD)??9999))}
  if(!records.length)throw new Error("Nessun dato sensore riconosciuto. Verifica il formato del file.");
  const critical=records.filter(r=>r.STA!==null&&r.STA<=45),ii=records.map(r=>r.I_I).filter(v=>v!==null),pw=records.map(r=>r.PW4).filter(v=>v!==null);
  document.getElementById("mntStats").innerHTML=`<div class="grid kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 0"><div class="card"><div class="muted">Sensori letti</div><div class="kpi-num">${records.length}</div></div><div class="card"><div class="muted">STA ≤ 45</div><div class="kpi-num">${critical.length}</div></div><div class="card"><div class="muted">Cassa rilevata</div><div class="kpi-num">${escapeHtml(cassa)}</div></div></div>`;
  document.getElementById("mntCharts").innerHTML=`<h2>STA e I_I per sensore</h2><div style="height:300px"><canvas id="sensorChart" style="width:100%;height:100%"></canvas></div><h2>PW4 per sensore</h2><div style="height:240px"><canvas id="pwChart" style="width:100%;height:100%"></canvas></div>`;
  drawSensorChart("sensorChart",records,["STA","I_I"]);drawSensorChart("pwChart",records,["PW4"]);
  document.getElementById("mntTable").innerHTML=table(["ADD / Sensore","I","I_I","STA","PW4"],records.map(r=>`<tr><td>${r.ADD}</td><td>${r.I??"—"}</td><td>${r.I_I??"—"}</td><td style="${r.STA!==null&&r.STA<=45?'color:var(--red);font-weight:800':''}">${r.STA??"—"}</td><td>${r.PW4??"—"}</td></tr>`).join(""));
  msg.textContent=`Analisi completata: ${file.name} · ${cassa} · ${critical.length} sensori con STA ≤ 45.`;
 }catch(err){msg.textContent="Errore: "+(err.message||String(err));}
}
function drawSensorChart(id,rows,keys){
 const canvas=document.getElementById(id);if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,pad={l:42,r:12,t:12,b:48};ctx.clearRect(0,0,w,h);
 const vals=rows.flatMap(r=>keys.map(k=>r[k])).filter(v=>v!==null&&v!==undefined);if(!vals.length){ctx.fillStyle="#94a5c2";ctx.fillText("Nessun valore numerico",pad.l,30);return}let min=Math.min(0,...vals),max=Math.max(...vals);if(max===min)max=min+1;
 const x=i=>pad.l+i*(w-pad.l-pad.r)/Math.max(1,rows.length-1),y=v=>h-pad.b-(v-min)*(h-pad.t-pad.b)/(max-min);
 ctx.strokeStyle="#293a56";ctx.fillStyle="#94a5c2";ctx.font="10px sans-serif";for(let j=0;j<=4;j++){let v=min+(max-min)*j/4,yy=y(v);ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(v.toFixed(1),3,yy+3)}
 const colors=["#4ea1ff","#49d4e8","#f4bd58"];keys.forEach((k,ki)=>{ctx.strokeStyle=colors[ki%colors.length];ctx.lineWidth=2;ctx.beginPath();let started=false;rows.forEach((r,i)=>{if(r[k]===null||r[k]===undefined){started=false;return}if(!started){ctx.moveTo(x(i),y(r[k]));started=true}else ctx.lineTo(x(i),y(r[k]))});ctx.stroke()});
 ctx.fillStyle="#94a5c2";const step=Math.max(1,Math.ceil(rows.length/18));rows.forEach((r,i)=>{if(i%step===0){ctx.save();ctx.translate(x(i),h-pad.b+5);ctx.rotate(-Math.PI/3);ctx.fillText(r.ADD,-2,0);ctx.restore()}});ctx.fillText(keys.join(" / "),pad.l, h-5);
}

function newScadenza(){content.innerHTML=head("Nuova scadenza","Aggiungi un'attività pianificata")+`<section class="card"><form id="scForm"><div class="form-grid"><div class="field full"><label>Attività *</label><input name="titolo" required></div><div class="field"><label>Treno *</label><input name="treno" required placeholder="ETR1000 · 102"></div><div class="field"><label>Responsabile</label><select name="responsabile">${data.tecnici.map(t=>`<option>${t}</option>`).join("")}</select></div><div class="field"><label>Data *</label><input type="date" name="data" required></div></div><div class="form-actions"><button type="button" class="btn" onclick="go('scadenze')">Annulla</button><button class="btn primary">Salva scadenza</button></div></form></section>`;document.getElementById("scForm").addEventListener("submit",e=>{e.preventDefault();data.scadenze.push({id:"SC-"+String(32+data.scadenze.length-3).padStart(3,"0"),...Object.fromEntries(new FormData(e.target))});save();go("scadenze");toast("Scadenza salvata nella demo.")})}

// =========================================================
// AUTENTICAZIONE: Supabase Auth (email/password, signup, reset)
// =========================================================
let authClient = null;
let authMode = "login";
let authRecoverySession = false;
function getAuthClient(){
  if(authClient) return authClient;
  const cfg=getSupabaseConfig();
  if(!cfg.url||!cfg.key) throw new Error("Configurazione Supabase mancante. Verifica Project URL e chiave pubblicabile.");
  if(!window.supabase) throw new Error("Libreria Supabase non caricata. Controlla la connessione Internet.");
  authClient=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return authClient;
}
function authMessage(text,type="error"){
  const el=document.getElementById("authMessage");if(!el)return;
  el.textContent=text;el.className="auth-message "+type;
}
function clearAuthMessage(){const el=document.getElementById("authMessage");if(el){el.textContent="";el.className="auth-message"}}
function showAuthMode(mode,message=""){
  authMode=mode;clearAuthMessage();
  const title=document.getElementById("authTitle"),sub=document.getElementById("authSubtitle"),name=document.getElementById("authNameField"),pw=document.getElementById("authPasswordField"),confirm=document.getElementById("authConfirmField"),submit=document.getElementById("authSubmit"),links=document.getElementById("authLinks"),password=document.getElementById("authPassword"),email=document.getElementById("authEmail");
  const isReset=mode==="reset",isSignup=mode==="signup",isUpdate=mode==="updatePassword";
  title.textContent=isSignup?"Crea un account":isReset?"Recupera password":isUpdate?"Imposta nuova password":"Accedi";
  sub.textContent=isSignup?"Registrati con la tua email e scegli una password.":isReset?"Ti invieremo un link per reimpostare la password.":isUpdate?"Scegli una nuova password per il tuo account.":"Accedi con il tuo account aziendale.";
  name.hidden=!isSignup;pw.hidden=isReset;confirm.hidden=!(isSignup||isUpdate);email.closest(".field").hidden=isUpdate;email.required=!isUpdate;password.required=!isReset;password.autocomplete=(isSignup||isUpdate)?"new-password":"current-password";
  document.getElementById("authName").required=isSignup;document.getElementById("authConfirm").required=isSignup||isUpdate;
  submit.textContent=isSignup?"Registrati":isReset?"Invia link di recupero":isUpdate?"Salva nuova password":"Accedi";
  links.innerHTML=isSignup?'<button class="auth-link" type="button" onclick="showAuthMode(\'login\')">Hai già un account? Accedi</button>':isReset?'<button class="auth-link" type="button" onclick="showAuthMode(\'login\')">Torna all’accesso</button>':isUpdate?"":'<button class="auth-link" type="button" onclick="showAuthMode(\'reset\')">Password dimenticata?</button><button class="auth-link" type="button" onclick="showAuthMode(\'signup\')">Crea un account</button>';
  if(message)authMessage(message,"success");
}
function showAuthOverlay(){const el=document.getElementById("authOverlay");if(el)el.style.display="flex"}
function hideAuthOverlay(){const el=document.getElementById("authOverlay");if(el)el.style.display="none"}
async function finishAuthGate(session){
  if(!session?.user){showAuthMode("login");showAuthOverlay();return}
  // Il link di recupero deve consentire di impostare la nuova password prima di entrare nell'app.
  if(authRecoverySession){showAuthMode("updatePassword");showAuthOverlay();return}
  hideAuthOverlay();
  const user=session.user;
  const label=user.user_metadata?.full_name||user.email||"Operatore";
  const avatar=document.querySelector(".top-actions .avatar");
  if(avatar){avatar.textContent=label.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"RM";avatar.title=label;avatar.style.cursor="pointer";avatar.onclick=async()=>{if(confirm("Vuoi uscire da Railway Maintenance?")){try{const {error}=await getAuthClient().auth.signOut();if(error)throw error;authRecoverySession=false;showAuthMode("login");showAuthOverlay();toast("Disconnessione completata.")}catch(e){toast("Errore durante la disconnessione: "+(e.message||String(e)))}}};}
  render();
}
document.getElementById("authForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("authSubmit");btn.disabled=true;const old=btn.textContent;btn.textContent="Attendi…";clearAuthMessage();
  const email=document.getElementById("authEmail").value.trim();const password=document.getElementById("authPassword").value;const confirmPw=document.getElementById("authConfirm").value;const fullName=document.getElementById("authName").value.trim();
  try{
    const client=getAuthClient();let result;
    if(authMode==="signup"){
      if(password.length<8)throw new Error("La password deve contenere almeno 8 caratteri.");
      if(password!==confirmPw)throw new Error("Le password non coincidono.");
      result=await client.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:location.origin+location.pathname}});
      if(result.error)throw result.error;
      if(result.data?.session){authRecoverySession=false;await finishAuthGate(result.data.session);toast("Registrazione completata.")}
      else{showAuthMode("login");authMessage("Registrazione inviata. Controlla la tua email e conferma l'indirizzo prima di accedere.","success");}
    }else if(authMode==="reset"){
      result=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(result.error)throw result.error;
      authMessage("Se l'indirizzo è registrato, riceverai un'email con il link per reimpostare la password.","success");
    }else if(authMode==="updatePassword"){
      if(password.length<8)throw new Error("La nuova password deve contenere almeno 8 caratteri.");
      if(password!==confirmPw)throw new Error("Le password non coincidono.");
      result=await client.auth.updateUser({password});if(result.error)throw result.error;
      authRecoverySession=false;authMessage("Password aggiornata. Accesso in corso…","success");
      setTimeout(()=>finishAuthGate(result.data?.user?{user:result.data.user}:null),700);
    }else{
      result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;
      authRecoverySession=false;await finishAuthGate(result.data.session);toast("Accesso effettuato.");
    }
  }catch(err){authMessage(err.message||"Operazione non riuscita. Riprova.","error")}
  finally{btn.disabled=false;btn.textContent=old;}
});
(async function initAuth(){
  try{
    const client=getAuthClient();
    client.auth.onAuthStateChange((event,session)=>{
      if(event==="PASSWORD_RECOVERY"){authRecoverySession=true;showAuthMode("updatePassword");showAuthOverlay();return}
      if(event==="SIGNED_OUT"){authRecoverySession=false;showAuthMode("login");showAuthOverlay();return}
      if(event==="SIGNED_IN"&&session&&!authRecoverySession){hideAuthOverlay();}
    });
    const {data,error}=await client.auth.getSession();if(error)throw error;
    const recovery=new URLSearchParams(location.hash.replace(/^#/ ,"")).get("type")==="recovery";
    if(recovery){authRecoverySession=true;showAuthMode("updatePassword");showAuthOverlay();}
    else if(data.session){await finishAuthGate(data.session);}
    else{showAuthMode("login");showAuthOverlay();}
  }catch(err){showAuthMode("login");showAuthOverlay();authMessage("Impossibile inizializzare l'autenticazione: "+(err.message||String(err)),"error")}
})();
